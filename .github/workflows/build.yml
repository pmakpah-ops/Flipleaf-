name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Clean
        run: flutter clean
      - name: Restore Android folder if missing
        run: |
          if [! -f "android/app/build.gradle" ]; then
            flutter create. --platforms=android
          fi
      - name: Get deps
        run: flutter pub get
      - name: Generate icons
        run: dart run flutter_launcher_icons || echo "icon skipped"
      - name: Build small APK
        run: flutter build apk --release --shrink --split-per-abi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flipleaf-small-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
